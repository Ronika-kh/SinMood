    <main>

        <section class="auth">
            <h2>ثبت‌نام در سینمود</h2>

            <form class="auth-form" action="#" method="post">
                <label for="reg-name">نام</label>
                <input type="text" id="reg-name" name="name" placeholder="نام و نام خانوادگی">

                <label for="reg-email">ایمیل</label>
                <input type="email" id="reg-email" name="email" placeholder="example@mail.com">

                <label for="reg-pass">رمز عبور</label>
                <input type="password" id="reg-pass" name="password">

                <label for="reg-pass2">تکرار رمز عبور</label>
                <input type="password" id="reg-pass2" name="password2">

                <button type="submit">ثبت‌نام</button>

                <p class="auth-switch">از قبل حساب داری؟ <a href="login.html">وارد شو</a></p>
            </form>
        </section>

    </main>
